<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
        <meta name="theme-color" content="#050816" />

        <!-- Apple & WebKit Mobile Meta Tags -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="format-detection" content="telephone=no" />

        <!-- Security Meta Headers -->
        <meta http-equiv="X-Content-Type-Options" content="nosniff" />
        <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />

        <title>Kodeveill | Premium Website Design Agency</title>
        <meta name="description" content="Kodeveill creates premium business websites, landing pages, ERP dashboards, portfolio websites, and responsive web solutions that help businesses grow online." />
        <meta name="keywords" content="website design, web development agency, landing pages, ERP dashboard, responsive websites, SEO websites, conversion-focused design" />
        <meta name="author" content="Kodeveill" />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="https://kodeveill.netlify.app/" />


        <!-- Preconnect & Font Optimization -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Kodeveill | Premium Website Design Agency" />
        <meta property="og:description" content="Websites that turn visitors into customers. Premium, responsive, SEO-friendly, conversion-focused web design." />
        <meta property="og:url" content="https://kodeveill.netlify.app/" />
        <meta property="og:image" content="https://kodeveill.netlify.app/kodeveill-logo.webp" />
        <meta property="og:site_name" content="Kodeveill" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Kodeveill | Premium Website Design Agency" />
        <meta name="twitter:description" content="Websites that turn visitors into customers. Premium, responsive, conversion-focused web design." />
        <meta name="twitter:image" content="https://kodeveill.netlify.app/kodeveill-logo.webp" />

        <link rel="icon" type="image/webp" href="%PUBLIC_URL%/kodeveill-logo.webp" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/kodeveill-logo.webp" />

        <!-- Structured Data (JSON-LD) -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "ProfessionalService",
          "name": "Kodeveill",
          "description": "Premium website design and development agency creating modern, responsive, SEO-friendly, conversion-focused websites for businesses.",
          "url": "https://kodeveill.netlify.app/",
          "email": "contact.kodeveil@gmail.com",
          "telephone": "+91-85950-18458",

          "slogan": "Websites That Turn Visitors Into Customers.",
          "areaServed": "Worldwide",
          "priceRange": "$$"
        }
        </script>

        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body className="bg-[#050816] text-white antialiased">
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
